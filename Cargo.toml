[package]
name = "artixy"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = { version = "0.6", default-features = false, features = ["cache", "handle_panics"] }
# serenity backend/features kept in sync with poise's own requirements
# (poise enables these minus chrono via its defaults); direct dep only to
# select the TLS backend without chrono.
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "model", "utils", "collector", "framework", "cache", "rustls_backend"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "1"
alacritty_terminal = "0.26"
fontdue = "0.9"
png = "0.18"

[profile.dev]
# Fast iteration: no debuginfo to write/link, max parallelism, incremental.
debug = 0
codegen-units = 256
incremental = true

[profile.release]
opt-level = 2
