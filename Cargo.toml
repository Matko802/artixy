[package]
name = "artixy"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "1"
alacritty_terminal = "0.26"
fontdue = "0.9"
png = "0.18"

[profile.release]
opt-level = 2
